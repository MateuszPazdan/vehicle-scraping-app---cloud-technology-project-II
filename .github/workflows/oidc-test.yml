name: oidc-test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  dev-identity:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/use-kubelogin@v1
        with:
          kubelogin-version: 'latest'

      - uses: azure/aks-set-context@v4
        with:
          resource-group: rg-vehicle-scraping
          cluster-name: aks-vehicle-scraping
          use-kubelogin: 'true'

      - name: Dostep do dev
        run: kubectl get pods -n dev

      - name: Dostep do prod
        run: |
          if kubectl get pods -n prod; then
            echo "BLAD: tozsamosc dev ma dostep do prod"
            exit 1
          fi
