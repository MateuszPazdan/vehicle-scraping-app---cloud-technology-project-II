apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: postgres-kv
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: 1a1b1d45-b066-4dde-9092-d88c3da00ec7
    keyvaultName: kv-vscrap-dev
    tenantId: d81a2e37-d18e-42ec-8839-9a2de1586e0c
    objects: |
      array:
        - |
          objectName: postgres-password
          objectType: secret

---

apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-kv
spec:
  provider: azure
  secretObjects:
    - secretName: backend-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: jwt-access-token-secret
          key: JWT_ACCESS_TOKEN_SECRET
        - objectName: admin-key
          key: ADMIN_KEY
  parameters:
    usePodIdentity: "false"
    clientID: 1a1b1d45-b066-4dde-9092-d88c3da00ec7
    keyvaultName: kv-vscrap-dev
    tenantId: d81a2e37-d18e-42ec-8839-9a2de1586e0c
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: jwt-access-token-secret
          objectType: secret
        - |
          objectName: admin-key
          objectType: secret
