apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: backend-migrate
    spec:
      restartPolicy: Never
      serviceAccountName: backend-sa
      containers:
        - name: migrate
          image: acrvehiclescraping.azurecr.io/backend
          command: ['node', 'node_modules/prisma/build/index.js', 'migrate', 'deploy']
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            requests:
              cpu: '50m'
              memory: '256Mi'
            limits:
              cpu: '400m'
              memory: '512Mi'
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-kv
