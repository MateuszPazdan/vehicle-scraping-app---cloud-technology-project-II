apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa
      containers:
        - name: backend
          image: acrvehiclescraping.azurecr.io/backend
          ports:
            - containerPort: 8000
          env:
            - name: NODE_ENV
              value: production
            - name: JWT_ACCESS_TOKEN_EXPIRATION_MS
              value: '3600000'
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: DATABASE_URL
            - name: JWT_ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: JWT_ACCESS_TOKEN_SECRET
            - name: ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: ADMIN_KEY
          volumeMounts:
            - name: kv-secrets
              mountPath: /mnt/secrets
              readOnly: true
          resources:
            requests:
              cpu: '50m'
              memory: '256Mi'
            limits:
              cpu: '400m'
              memory: '512Mi'
      volumes:
        - name: kv-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: backend-kv

---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  selector:
    app: backend
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
